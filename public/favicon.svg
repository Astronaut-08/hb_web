<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
 "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
    <style>
    .c-red { fill: #f04358; }
    .c-red-dark { fill: #d33045; }
    .c-yellow { fill: #fdd034; }
    .c-yellow-dark { fill: #e5b620; }
    .c-outline { fill: #1a1a1a; }
    .s-outline { stroke: #1a1a1a; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</defs>

<!-- BACK CARD GROUP (Rotated) -->
<g transform="rotate(-18 240 220)">
    <!-- Back Card Shadow / Darker Part -->
    <rect x="70" y="80" width="310" height="200" rx="32" class="c-red-dark"></rect>
    <!-- Back Card Main Body -->
    <rect x="70" y="80" width="310" height="180" rx="32" class="c-red"></rect>
    <!-- Back Card Outline -->
    <rect x="70" y="80" width="310" height="200" rx="32" fill="none" class="s-outline"></rect>
</g>

<!-- FRONT CARD GROUP -->
<g id="frontCard">
    <!-- Front Card Background Base (Red) -->
    <rect x="56" y="136" width="400" height="250" rx="32" class="c-red"></rect>
    
    <!-- Front Card Dark Red Accent/Shadow on Left -->
    <path d="M 88 136 C 70.3 136 56 150.3 56 168 L 56 354 C 56 371.7 70.3 386 88 386 L 160 386 L 210 136 Z" class="c-red-dark"></path>

    <!-- Front Card Outline -->
    <rect x="56" y="136" width="400" height="250" rx="32" fill="none" class="s-outline"></rect>

    <!-- HORIZONTAL RIBBON -->
    <rect x="56" y="210" width="400" height="38" class="c-yellow"></rect>
    <!-- Horizontal Ribbon Shadow/Accent -->
    <path d="M 56 230 L 456 230 L 456 248 L 56 248 Z" class="c-yellow-dark" opacity="0.3"></path>
    <!-- Horizontal Ribbon Border Lines -->
    <line x1="56" y1="210" x2="456" y2="210" class="s-outline"></line>
    <line x1="56" y1="248" x2="456" y2="248" class="s-outline"></line>

    <!-- VERTICAL RIBBON -->
    <rect x="172" y="136" width="40" height="250" class="c-yellow"></rect>
    <!-- Vertical Ribbon Accent -->
    <rect x="192" y="136" width="20" height="250" class="c-yellow-dark" opacity="0.3"></rect>
    <!-- Vertical Ribbon Border Lines -->
    <line x1="172" y1="136" x2="172" y2="386" class="s-outline"></line>
    <line x1="212" y1="136" x2="212" y2="386" class="s-outline"></line>

    <!-- CARD TEXT LINES (Bottom Right) -->
    <line x1="326" y1="310" x2="416" y2="310" class="s-outline"></line>
    <line x1="326" y1="338" x2="416" y2="338" class="s-outline"></line>

    <!-- BOW AND KNOT -->
    <!-- Top-Left Loop Outer -->
    <path d="M 192 210 C 130 140 85 215 170 250 Z" class="c-yellow"></path>
    <path d="M 170 215 C 130 170 110 215 160 238 Z" class="c-yellow-dark"></path>
    <path d="M 192 210 C 130 140 85 215 170 250 Z" fill="none" class="s-outline"></path>
    <path d="M 130 188 C 150 200 172 215 172 215" fill="none" class="s-outline"></path>

    <!-- Top-Right Loop Outer -->
    <path d="M 192 210 C 254 140 299 215 214 250 Z" class="c-yellow"></path>
    <path d="M 214 215 C 254 170 274 215 224 238 Z" class="c-yellow-dark"></path>
    <path d="M 192 210 C 254 140 299 215 214 250 Z" fill="none" class="s-outline"></path>
    <path d="M 254 188 C 234 200 212 215 212 215" fill="none" class="s-outline"></path>

    <!-- Bottom-Left Ribbon Tail -->
    <path d="M 175 225 L 98 252 L 138 290 L 180 252 Z" class="c-yellow"></path>
    <path d="M 138 290 L 180 252 L 175 225 L 125 262 Z" class="c-yellow-dark"></path>
    <path d="M 175 225 L 98 252 L 138 290 L 180 252 Z" fill="none" class="s-outline"></path>

    <!-- Bottom-Right Ribbon Tail -->
    <path d="M 209 225 L 286 252 L 246 290 L 204 252 Z" class="c-yellow"></path>
    <path d="M 209 225 L 250 240 L 246 290 L 204 252 Z" class="c-yellow-dark"></path>
    <path d="M 209 225 L 286 252 L 246 290 L 204 252 Z" fill="none" class="s-outline"></path>

    <!-- Center Knot -->
    <circle cx="192" cy="210" r="22" class="c-yellow"></circle>
    <path d="M 180 196 A 22 22 0 0 0 204 226 A 22 22 0 0 1 180 196 Z" class="c-yellow-dark"></path>
    <circle cx="192" cy="210" r="22" fill="none" class="s-outline"></circle>
</g>
</svg>
